[package]
name    = "farming-pool"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest    = false

[features]
# Enables `farming_pool::WASM` — the compiled contract bytes for use in
# cross-crate integration tests (e.g. factory's test suite).
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Property-based tests for credit-accrual invariants (#75). Deliberately a
# plain dev-dependency rather than part of the `testutils` feature above:
# `testutils` is forwarded to dependents (`factory` enables it to get
# `farming_pool::WASM`), whereas proptest is only ever needed by this crate's
# own `src/test.rs`. Dev-dependencies are not built for
# `cargo build --target wasm32v1-none --release`, so this cannot reach the
# `#![no_std]` contract binary.
proptest = "1"
